name: Cross-platform build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            qt_arch: linux_gcc_64
          - name: Windows
            os: windows-2025
            qt_arch: win64_msvc2022_64
          - name: macOS
            os: macos-15
            qt_arch: clang_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev pkg-config ninja-build libgl1-mesa-dev libxkbcommon-dev

      - name: Install Ninja
        if: runner.os != 'Linux'
        run: python -m pip install ninja

      - name: Enable MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: desktop
          arch: ${{ matrix.qt_arch }}
          # qtdeclarative is a default archive in Qt 6.8.3, not an add-on module.
          # Requesting it via modules: makes aqtinstall fail on linux_gcc_64.
          modules: 'qtmultimedia qtconnectivity'
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DAURALIS_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package
        run: cpack --config build/CPackConfig.cmake
        env:
          LD_LIBRARY_PATH: ${{ env.QT_ROOT_DIR }}/lib:${{ env.LD_LIBRARY_PATH }}
