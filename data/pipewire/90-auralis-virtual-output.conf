# Auralis system-audio entry point. Applications render to the sink half;
# Auralis routes the source half to the selected physical/Bluetooth sinks.
# nofail keeps the desktop audio service usable if an older PipeWire install
# does not provide the loopback module.
context.modules = [
    {
        name = libpipewire-module-loopback
        flags = [ ifexists nofail ]
        args = {
            node.name = "auralis_virtual_output"
            node.description = "Auralis Virtual Output"
            audio.rate = 48000
            audio.channels = 2
            audio.position = [ FL FR ]
            target.delay.sec = 0.0

            capture.props = {
                node.name = "auralis_virtual_output"
                node.description = "Auralis Virtual Output"
                media.class = "Audio/Sink"
                node.virtual = true
                node.autoconnect = false
                # Stay visible without stealing the user's current default.
                priority.session = 100
                auralis.virtual.output = true
                auralis.virtual.role = "sink"
                auralis.virtual.persistence = "package"
            }

            playback.props = {
                node.name = "auralis_virtual_output.source"
                node.description = "Auralis System Audio"
                media.class = "Stream/Output/Audio"
                node.virtual = true
                node.autoconnect = false
                node.dont-fallback = true
                node.dont-reconnect = true
                node.passive = true
                stream.dont-remix = true
                auralis.virtual.output = true
                auralis.virtual.role = "source"
                auralis.virtual.persistence = "package"
            }
        }
    }
]
